<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garrett Erickson — Contact</title>
<meta name="description" content="Garrett Erickson, photographer — Michigan. Phone, email, Instagram and booking.">
<link rel="stylesheet" href="../css/style.css">
<style>
  .vcard {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(1.2rem, 3vh, 2rem);
    max-width: 460px;
    margin: 0 auto;
    padding: clamp(2rem, 6vh, 4rem) var(--pad);
  }
  .vcard__name {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: clamp(2.6rem, 13vw, 4rem);
    line-height: 0.96;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .vcard__role {
    font-family: var(--font-ui);
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.45em;
    text-indent: 0.45em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-top: 0.5rem;
  }
  .vcard__list { display: flex; flex-direction: column; gap: 0.6rem; }
  .vrow {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 0.95rem 1.1rem;
    border-radius: var(--r-md);
    background: var(--glass-bg);
    border: 1px solid var(--glass-line);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    transition: background 0.2s ease, transform 0.35s var(--ease);
  }
  .vrow:hover { background: var(--glass-bg-hover); transform: translateY(-2px); }
  .vrow svg { flex: none; }
  .vrow__text { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
  .vrow__label {
    font-family: var(--font-ui);
    font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-dim);
  }
  .vrow__value {
    font-size: 1rem; font-weight: 600; letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }
  .vcard__save {
    display: block; text-align: center;
    background: var(--ink); color: var(--bg);
    border: 0; border-radius: var(--r-full);
    padding: 1rem 1.25rem;
    font-family: var(--font-ui);
    font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer;
  }
  .vcard__save:hover { background: #fff; }
  .vcard__foot { text-align: center; }
</style>
</head>
<body data-page="card">

<main class="vcard">
  <header>
    <h1 class="vcard__name">Garrett<br>Erickson</h1>
    <p class="vcard__role">Photographer · Michigan</p>
  </header>

  <div class="vcard__list">
    <a class="vrow" href="tel:+12482254437">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/>
      </svg>
      <span class="vrow__text">
        <span class="vrow__label">Phone</span>
        <span class="vrow__value">248-225-4437</span>
      </span>
    </a>

    <a class="vrow" href="mailto:Garrettoscarerickson@gmail.com">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="4" width="20" height="16" rx="2.5"/>
        <path d="m2.5 6.5 9.5 6.5 9.5-6.5"/>
      </svg>
      <span class="vrow__text">
        <span class="vrow__label">Email</span>
        <span class="vrow__value">Garrettoscarerickson@gmail.com</span>
      </span>
    </a>

    <a class="vrow" href="https://www.instagram.com/shot_by_ge" target="_blank" rel="noopener noreferrer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
      <span class="vrow__text">
        <span class="vrow__label">Instagram</span>
        <span class="vrow__value">@shot_by_ge</span>
      </span>
    </a>

    <a class="vrow" href="https://venmo.com/Garrett-Erickson-31" target="_blank" rel="noopener noreferrer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <path d="M8.4 7.8 11.3 16h1.6l3-8.2"/>
      </svg>
      <span class="vrow__text">
        <span class="vrow__label">Venmo</span>
        <span class="vrow__value">@Garrett-Erickson-31</span>
      </span>
    </a>

    <a class="vrow" href="../index.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3.2 9.5h17.6M3.2 14.5h17.6"/>
        <path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/>
      </svg>
      <span class="vrow__text">
        <span class="vrow__label">Portfolio</span>
        <span class="vrow__value">garrettphoto.store</span>
      </span>
    </a>
  </div>

  <button class="vcard__save" id="save-contact" type="button">Save to contacts</button>
  <p class="vcard__foot mono">Architecture · Street · Sports</p>
</main>

<script>
/* hand the phone a standard vCard so "Save to contacts" just works */
document.getElementById("save-contact").addEventListener("click", function () {
  var vcf = [
    "BEGIN:VCARD", "VERSION:3.0",
    "N:Erickson;Garrett;;;",
    "FN:Garrett Erickson",
    "TITLE:Photographer",
    "TEL;TYPE=CELL:+12482254437",
    "EMAIL:Garrettoscarerickson@gmail.com",
    "URL:https://garrettphoto.store",
    "X-SOCIALPROFILE;TYPE=instagram:https://www.instagram.com/shot_by_ge",
    "NOTE:Architecture, street and sports photography. Venmo @Garrett-Erickson-31",
    "END:VCARD"
  ].join("\r\n");
  var a = document.createElement("a");
  a.href = "data:text/vcard;charset=utf-8," + encodeURIComponent(vcf);
  a.download = "Garrett-Erickson.vcf";
  document.body.appendChild(a); a.click(); a.remove();
});
</script>
</body>
</html>
